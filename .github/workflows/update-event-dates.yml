name: Check official trail event dates

on:
  push:
    paths:
      - "index.html"
      - "scripts/update_event_dates.py"
      - "scripts/validate_event_data.py"
      - "scripts/test-metrics.mjs"
      - ".github/workflows/update-event-dates.yml"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-event-date-feed
  cancel-in-progress: false

jobs:
  update-dates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate event and route data
        run: python scripts/validate_event_data.py
      - name: Read official event pages
        run: python scripts/update_event_dates.py
      - name: Commit date feed when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add event-dates.json
          if ! git diff --cached --quiet; then
            git commit -m "Update verified official event dates"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if git rebase origin/main; then
                if git push origin HEAD:main; then
                  exit 0
                fi
              else
                echo "Date feed changed during the run; recomputing against the latest main branch."
                git rebase --abort
                git reset --hard origin/main
                python scripts/validate_event_data.py
                python scripts/update_event_dates.py
                git add event-dates.json
                if git diff --cached --quiet; then
                  echo "The latest branch already contains the current date feed."
                  exit 0
                fi
                git commit -m "Update verified official event dates"
              fi
              sleep 3
            done
            echo "Could not push the date feed after five attempts"
            exit 1
          fi
