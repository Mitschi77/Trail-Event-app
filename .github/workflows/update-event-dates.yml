name: Prepare official event-date review proposals

on:
  push:
    paths:
      - "index.html"
      - "scripts/update_event_dates.py"
      - "scripts/validate_event_data.py"
      - "scripts/test-metrics.mjs"
      - ".github/workflows/update-event-dates.yml"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-event-date-feed
  cancel-in-progress: true

jobs:
  update-dates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Node dependencies
        run: npm ci
      - name: Run JavaScript syntax and regression tests
        run: npm run test:syntax
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate event and route data
        run: python scripts/validate_event_data.py
      - name: Read official event pages
        run: python scripts/update_event_dates.py
      - name: Report proposed date-feed changes (never publish automatically)
        run: |
          if git diff --quiet -- event-dates.json; then
            echo "No event-date changes detected."
          else
            echo "Event-date changes detected. They remain local to this workflow run and are not committed or published."
            git diff --stat -- event-dates.json
          fi
      - name: Store proposed date feed for manual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-date-review
          path: event-dates.json
          if-no-files-found: ignore
          retention-days: 14
