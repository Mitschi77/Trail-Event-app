name: Supabase Auth session end-to-end test

on:
  pull_request:
    branches: [main, fix/single-active-device-session]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-auth-session-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-auth-session-e2e:
    name: Real GoTrue sessions, Edge Runtime, PostgREST RLS and Storage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13
        with:
          version: v2.stable

      - name: Verify CLI version and start isolated local stack
        run: |
          supabase --version
          supabase start -x studio,logflare,vector,imgproxy,mailpit,postgres-meta,realtime

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Bootstrap disposable test schema and apply session migration
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f scripts/local_supabase_session_bootstrap.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261123100000_single_active_device_session.sql
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Start local Supabase Edge Runtime with test credentials
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          env_file="$RUNNER_TEMP/supabase-functions.env"
          {
            printf 'SUPABASE_URL=%s\\n' "$API_URL"
            printf 'SUPABASE_ANON_KEY=%s\\n' "$ANON_KEY"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\\n' "$SERVICE_ROLE_KEY"
          } > "$env_file"
          supabase functions serve --no-verify-jwt --env-file "$env_file" > "$RUNNER_TEMP/edge-runtime.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/edge-runtime.pid"
          for attempt in $(seq 1 60); do
            status="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:54321/functions/v1/send-owner-test-push || true)"
            if [ "$status" = "405" ]; then
              echo "Local Edge Runtime is ready."
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/edge-runtime.log"
          echo "Local Edge Runtime did not become ready."
          exit 1

      - name: Exercise real GoTrue sessions, RLS, Storage and privileged Edge Functions
        run: node scripts/test_local_supabase_auth_sessions.mjs

      - name: Stop local Edge Runtime
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/edge-runtime.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/edge-runtime.pid")" || true
          fi

      - name: Stop isolated local stack
        if: always()
        run: supabase stop --no-backup
