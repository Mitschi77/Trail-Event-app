name: Deploy Trailrunning app to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pages-deploy.yml'
      - 'index.html'
      - '*.css'
      - '*.js'
      - '*.json'
      - 'assets/**'
      - 'icons/**'
      - 'manifest*'
      - 'service-worker*'
      - 'sw.js'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: touch .nojekyll

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
