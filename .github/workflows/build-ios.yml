name: Build iOS simulator app

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "event-dates.json"
      - "manifest.webmanifest"
      - "trail-icon.svg"
      - "trail-apple-touch-icon.png"
      - "ios/**"
      - "package.json"
      - "capacitor.config.json"
      - "scripts/prepare-native.mjs"
      - "scripts/check-inline.mjs"
      - "scripts/test-metrics.mjs"
      - ".github/workflows/build-ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate app JavaScript
        run: npm run test:syntax
      - name: Sync Capacitor assets
        run: npm run ios:sync
      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
