name: App syntax and regression tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node syntax and regression suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check owner push Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/send-owner-test-push/index.ts
      - name: Run app syntax and regression tests
        run: npm run test:syntax
      - name: Check Python workflow scripts
        run: python3 -m py_compile scripts/update_event_dates.py scripts/validate_event_data.py scripts/submit_event_date_proposals.py
      - name: Validate event and route data, including date-feed route IDs
        run: python3 scripts/validate_event_data.py
