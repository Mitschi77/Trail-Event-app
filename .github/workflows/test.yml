name: App syntax and regression tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node syntax and regression suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run app syntax and regression tests
        run: npm run test:syntax
      - name: Check Python workflow scripts
        run: python3 -m py_compile scripts/update_event_dates.py scripts/validate_event_data.py scripts/submit_event_date_proposals.py scripts/apply_approved_date_proposals.py scripts/test_apply_approved_date_proposals.py
      - name: Verify OIDC-only Supabase function configuration
        run: |
          python3 - <<'PY'
          import tomllib
          with open("supabase/config.toml", "rb") as f:
              config = tomllib.load(f)
          functions = config["functions"]
          for name in ("ingest-event-date-proposals", "export-approved-event-date-proposals"):
              assert functions[name]["verify_jwt"] is False, f"{name} must validate GitHub OIDC in its handler"
          print("Verified Supabase GitHub-OIDC function authentication settings.")
          PY
      - name: Test guarded approved-date proposal application
        run: python3 -m unittest scripts/test_apply_approved_date_proposals.py
      - name: Validate event and route data, including date-feed route IDs
        run: python3 scripts/validate_event_data.py
