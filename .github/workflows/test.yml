name: App syntax and regression tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node syntax and regression suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check owner push Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/send-owner-test-push/index.ts
      - name: Type-check Strava Edge Functions
        run: |
          deno check --node-modules-dir=auto supabase/functions/strava-connect/index.ts
          deno check --node-modules-dir=auto supabase/functions/strava-callback/index.ts
          deno check --node-modules-dir=auto supabase/functions/strava-sync/index.ts
      - name: Run app syntax and regression tests
        run: npm run test:syntax
      - name: Run Python event-data regression tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check Python workflow scripts
        run: python3 -m py_compile scripts/update_event_dates.py scripts/validate_event_data.py scripts/submit_event_date_proposals.py scripts/event_source_status.py scripts/test_event_source_status.py scripts/submit_event_data_proposals.py scripts/test_submit_event_data_proposals.py scripts/run_proposal_ingestion_db_test.py
      - name: Test official event source health classification
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate event and route data, including date-feed route IDs
        run: python3 scripts/validate_event_data.py

  proposal-ingestion-db-test:
    name: Proposal ingestion PostgreSQL concurrency test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trailtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trailtest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Test atomic proposal ingestion under concurrent requests
        run: python3 scripts/run_proposal_ingestion_db_test.py
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: trailtest
  strava-race-links-db-test:
    name: Strava race-link PostgreSQL migration test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trailtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trailtest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Test Strava race-link migration and integrity rules
        run: python3 scripts/run_strava_race_links_db_test.py
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: trailtest
  community-mvp-db-test:
    name: Community MVP PostgreSQL RLS and storage test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trailtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trailtest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Test Community MVP migration and RLS/storage access
        run: python3 scripts/run_community_mvp_db_test.py
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: trailtest
