name: App syntax and regression tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node syntax and regression suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run app syntax and regression tests
        run: npm run test:syntax
      - name: Set up Python for event data validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile Python data scripts
        run: python -m py_compile scripts/find_missing_event_data.py scripts/event_data_candidates.py scripts/test_event_data_candidates.py scripts/submit_event_data_proposals.py scripts/update_event_dates.py scripts/validate_event_data.py
      - name: Test conservative event data candidate extraction
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate event and route data feed
        run: python scripts/validate_event_data.py
