name: Prepare native iOS project

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "event-dates.json"
      - "manifest.webmanifest"
      - "trail-icon.svg"
      - "trail-apple-touch-icon.png"
      - "package.json"
      - "capacitor.config.json"
      - "scripts/prepare-native.mjs"
      - "scripts/check-inline.mjs"
      - "scripts/test-metrics.mjs"
      - ".github/workflows/prepare-ios-project.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-ios:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate app JavaScript
        run: npm run test:syntax
      - name: Generate native iOS project
        run: |
          if [ -d ios/App/App.xcodeproj ]; then npm run ios:sync; else npm run ios:add; fi
          npm run build
      - name: Commit generated Xcode project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios
          if ! git diff --cached --quiet; then
            git commit -m "Generate native Capacitor iOS project"
            git push
          else
            echo "No native project changes to commit."
          fi
