name: Find missing event and route data
on:
  push:
    paths:
      - "scripts/find_missing_event_data.py"
      - "scripts/submit_event_data_proposals.py"
      - ".github/workflows/find-missing-event-data.yml"
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: event-data-finder
  cancel-in-progress: true
jobs:
  find-and-propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Search missing GPX, elevation and cut-off evidence
        run: python scripts/find_missing_event_data.py
      - name: Submit candidates to owner review queue
        run: python scripts/submit_event_data_proposals.py
      - name: Keep scan report for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-data-finder-report
          path: event-data-proposals.json
          if-no-files-found: ignore
          retention-days: 14
